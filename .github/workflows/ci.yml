name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-fractal:
    name: Validate fractal trinity layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm ci || npm install

      - name: Validate fractal layout
        run: npm run validate:fractal

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --if-present
